<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4D3E" />
      <stop offset="100%" stop-color="#0F2D24" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D7A58" />
      <stop offset="50%" stop-color="#559966" />
      <stop offset="100%" stop-color="#88B04B" />
    </linearGradient>
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#88B04B" />
      <stop offset="100%" stop-color="#A4D65E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4" />

  <!-- Central Circular Economy Loop with Leaf -->
  <g filter="url(#glow)">
    <!-- Recycled Arc Loop 1 -->
    <path d="M 256 100 A 156 156 0 0 1 405 220 L 372 232 A 122 122 0 0 0 256 136 Z" fill="url(#loopGrad)" />
    <!-- Arrow Head 1 -->
    <polygon points="410,230 435,185 375,200" fill="#A4D65E" />

    <!-- Recycled Arc Loop 2 -->
    <path d="M 405 292 A 156 156 0 0 1 256 412 L 256 376 A 122 122 0 0 0 372 280 Z" fill="url(#loopGrad)" />
    <!-- Arrow Head 2 -->
    <polygon points="256,420 286,370 230,370" fill="#A4D65E" />

    <!-- Recycled Arc Loop 3 -->
    <path d="M 107 220 A 156 156 0 0 1 256 100 L 256 136 A 122 122 0 0 0 140 232 Z" fill="url(#loopGrad)" />
    <!-- Arrow Head 3 -->
    <polygon points="102,230 137,200 77,185" fill="#A4D65E" />

    <!-- Stylized Central Leaf -->
    <path d="M 256 170 C 190 200 170 270 200 330 C 230 390 310 370 340 310 C 370 250 310 180 256 170 Z" fill="url(#leafGrad)" />
    <!-- Leaf Center Stem Rib -->
    <path d="M 220 335 Q 260 270 310 205" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-opacity="0.75" />
    <path d="M 245 285 Q 275 290 295 275" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-opacity="0.6" />
    <path d="M 270 250 Q 295 255 315 240" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-opacity="0.6" />
  </g>

  <!-- Ipatinga Vale do Aço mark -->
  <circle cx="256" cy="452" r="6" fill="#88B04B" />
</svg>
